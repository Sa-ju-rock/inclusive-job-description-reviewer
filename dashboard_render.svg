  <g transform="translate(315, 392)">
    <rect x="0" y="0" width="185" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="92" y="17" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Total: <tspan font-weight="800">128 Words</tspan></text>

    <rect x="200" y="0" width="185" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="292" y="17" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Masculine: <tspan font-weight="800">10 Terms</tspan></text>

    <rect x="400" y="0" width="185" height="26" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="492" y="17" font-size="11" font-weight="600" fill="#6B21A8" text-anchor="middle">Feminine: <tspan font-weight="800">0 Terms</tspan></text>

    <rect x="600" y="0" width="205" height="26" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="702" y="17" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">Unique Categories: <tspan font-weight="800">8 Flagged</tspan></text>
  </g>

  <!-- ================= ANNOTATED TEXT VIEW CARD ================= -->
  <g filter="url(#shadowLg)">
    <rect x="40" y="450" width="1120" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- Tab Header -->
  <rect x="40" y="450" width="1120" height="44" rx="16" fill="#F8FAFC" />
  <rect x="52" y="456" width="145" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="124" y="476" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Annotated View</text>

  <rect x="205" y="456" width="155" height="32" rx="8" fill="none" />
  <text x="282" y="476" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Inclusive Revised Text</text>

  <rect x="1000" y="456" width="145" height="32" rx="8" fill="#059669" />
  <text x="1072" y="476" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Copy Inclusive Text</text>

  <!-- Text Content Area -->
  <g transform="translate(65, 515)" font-size="13" font-weight="400" fill="#334155" line-height="24">
    <!-- Line 1 -->
    <text x="0" y="16">We are looking for a relentless</text>
    <rect x="180" y="2" width="76" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="185" y="16" font-weight="700" fill="#1E40AF">Rockstar<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <rect x="264" y="2" width="58" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="269" y="16" font-weight="700" fill="#1E40AF">Ninja<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="328" y="16">Engineer to</text>
    <rect x="403" y="2" width="75" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="408" y="16" font-weight="700" fill="#1E40AF">dominate<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="484" y="16">our backend architecture and</text>
    <rect x="670" y="2" width="58" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="675" y="16" font-weight="700" fill="#1E40AF">crush<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>
    <text x="734" y="16">technical debt!</text>

    <!-- Line 2 -->
    <text x="0" y="46">As an</text>
    <rect x="40" y="32" width="88" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="45" y="46" font-weight="700" fill="#1E40AF">aggressive<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="132" y="46">,</text>
    <rect x="140" y="32" width="72" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="145" y="46" font-weight="700" fill="#1E40AF">fearless<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="216" y="46">problem solver, you will</text>
    <rect x="365" y="32" width="60" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="370" y="46" font-weight="700" fill="#1E40AF">tackle<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="430" y="46">our most challenging roadmaps and</text>
    <rect x="668" y="32" width="66" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="673" y="46" font-weight="700" fill="#1E40AF">enforce<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>
    <text x="738" y="46">superior standards.</text>

    <!-- Line 3 -->
    <text x="0" y="76">You must be an</text>
    <rect x="96" y="62" width="98" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="101" y="76" font-weight="700" fill="#1E40AF">independent<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="198" y="76">individual who takes charge and</text>
    <rect x="408" y="62" width="96" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <text x="413" y="76" font-weight="700" fill="#1E40AF">outperforms<tspan font-size="9" fill="#1D4ED8"> [M]</tspan></text>

    <text x="508" y="76">the competition across high-stakes deployments.</text>
  </g>

  <!-- Tooltip Simulation Overlay -->
  <g transform="translate(230, 560)" filter="url(#shadowSm)">
    <rect x="0" y="0" width="260" height="68" rx="8" fill="#0F172A" />
    <path d="M 30 0 L 36 -6 L 42 0 Z" fill="#0F172A" />
    <text x="12" y="18" font-size="11" font-weight="700" fill="#93C5FD">Masculine-Coded: "ninja"</text>
    <text x="12" y="34" font-size="10" font-weight="400" fill="#CBD5E1">Hyper-masculine jargon implying solitary bravado.</text>
    <text x="12" y="52" font-size="10.5" font-weight="700" fill="#34D399">Try: expert engineer, talented specialist</text>
  </g>

  <!-- ================= REPLACEMENT CARDS SECTION ================= -->
  <text x="40" y="700" font-size="16" font-weight="700" fill="#0F172A">Concrete Inclusive Replacements</text>
  <text x="1160" y="700" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">8 terms flagged</text>

  <!-- Card 1: Rockstar -->
  <rect x="40" y="715" width="265" height="155" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <rect x="52" y="725" width="75" height="22" rx="4" fill="#EFF6FF" />
  <text x="60" y="740" font-size="12" font-weight="800" fill="#1E40AF">"rockstar"</text>
  <text x="290" y="740" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">1× in text</text>
  <text x="52" y="765" font-size="10" font-weight="500" fill="#64748B">Exclusionary tech-bro trope that deters diverse candidates.</text>
  <text x="52" y="790" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.5">RECOMMENDED REPLACEMENTS:</text>
  <rect x="52" y="800" width="135" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="60" y="815" font-size="10" font-weight="600" fill="#0F172A">→ skilled professional</text>
  <rect x="52" y="828" width="150" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="60" y="843" font-size="10" font-weight="600" fill="#0F172A">→ experienced developer</text>

  <!-- Card 2: Ninja -->
  <rect x="325" y="715" width="265" height="155" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <rect x="337" y="725" width="65" height="22" rx="4" fill="#EFF6FF" />
  <text x="345" y="740" font-size="12" font-weight="800" fill="#1E40AF">"ninja"</text>
  <text x="575" y="740" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">1× in text</text>
  <text x="337" y="765" font-size="10" font-weight="500" fill="#64748B">Hyper-masculine jargon implying extreme individual bravado.</text>
  <text x="337" y="790" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.5">RECOMMENDED REPLACEMENTS:</text>
  <rect x="337" y="800" width="115" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="345" y="815" font-size="10" font-weight="600" fill="#0F172A">→ expert engineer</text>
  <rect x="337" y="828" width="130" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="345" y="843" font-size="10" font-weight="600" fill="#0F172A">→ talented specialist</text>

  <!-- Card 3: Dominate -->
  <rect x="610" y="715" width="265" height="155" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <rect x="622" y="725" width="80" height="22" rx="4" fill="#EFF6FF" />
  <text x="630" y="740" font-size="12" font-weight="800" fill="#1E40AF">"dominate"</text>
  <text x="860" y="740" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">1× in text</text>
  <text x="622" y="765" font-size="10" font-weight="500" fill="#64748B">Combative framing that deters relationship-oriented talent.</text>
  <text x="622" y="790" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.5">RECOMMENDED REPLACEMENTS:</text>
  <rect x="622" y="800" width="70" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="630" y="815" font-size="10" font-weight="600" fill="#0F172A">→ lead</text>
  <rect x="622" y="828" width="85" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="630" y="843" font-size="10" font-weight="600" fill="#0F172A">→ excel in</text>

  <!-- Card 4: Crush -->
  <rect x="895" y="715" width="265" height="155" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <rect x="907" y="725" width="65" height="22" rx="4" fill="#EFF6FF" />
  <text x="915" y="740" font-size="12" font-weight="800" fill="#1E40AF">"crush"</text>
  <text x="1145" y="740" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">1× in text</text>
  <text x="907" y="765" font-size="10" font-weight="500" fill="#64748B">Aggressive pressure framing alienating team players.</text>
  <text x="907" y="790" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.5">RECOMMENDED REPLACEMENTS:</text>
  <rect x="907" y="800" width="75" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="915" y="815" font-size="10" font-weight="600" fill="#0F172A">→ achieve</text>
  <rect x="907" y="828" width="75" height="22" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="915" y="843" font-size="10" font-weight="600" fill="#0F172A">→ resolve</text>

</svg>
