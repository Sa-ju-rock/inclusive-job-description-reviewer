<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sdgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>
    <!-- Soft Shadows -->
    <filter id="shadowLg" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="shadowSm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="#F8FAFC" />

  <!-- SDG 5 Global Header Strip -->
  <rect width="1200" height="34" fill="url(#sdgGrad)" />
  <rect x="40" y="7" width="52" height="20" rx="4" fill="#FFFFFF" />
  <text x="66" y="21" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">SDG 5</text>
  <text x="104" y="21" font-size="12" font-weight="600" fill="#FFFFFF">United Nations Sustainable Development Goal 5: Gender Equality in Technical Recruitment</text>
  <text x="1160" y="21" font-size="11" font-weight="500" fill="#FEE2E2" text-anchor="end">Target 5.5: Equal Opportunities &amp; Leadership</text>

  <!-- Navigation Bar -->
  <rect y="34" width="1200" height="66" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="40" y="47" width="40" height="40" rx="10" fill="url(#logoGrad)" />
  <!-- Scales Icon -->
  <path d="M 60 55 L 60 77 M 52 61 L 68 61 M 52 61 L 48 71 M 52 61 L 56 71 M 48 71 L 56 71 M 68 61 L 64 71 M 68 61 L 72 71 M 64 71 L 72 71" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  <text x="92" y="66" font-size="20" font-weight="800" fill="#0F172A">Equi<tspan fill="#E11D48">Text</tspan></text>
  <text x="92" y="80" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">BIAS-FREE JOB REVIEWER</text>

  <!-- Nav links -->
  <text x="860" y="72" font-size="13" font-weight="600" fill="#64748B">Audit History</text>
  <text x="970" y="72" font-size="13" font-weight="600" fill="#64748B">SDG 5 Research</text>
  <rect x="1060" y="49" width="100" height="36" rx="8" fill="#E11D48" />
  <text x="1110" y="72" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scan Post</text>

  <!-- Breadcrumb & Title Area -->
  <text x="40" y="130" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">ANALYZER / <tspan fill="#E11D48">AUDIT REPORT #1</tspan></text>
  <text x="40" y="160" font-size="24" font-weight="800" fill="#0F172A">Senior Rockstar Full-Stack Engineer (High Masculine Bias)</text>
  <text x="40" y="180" font-size="12" font-weight="500" fill="#64748B">Analyzed on October 9, 2026 • Real-Time Rule-Based NLP Scanner (Gaucher et al. 2011)</text>

  <!-- Export & Back Buttons -->
  <rect x="940" y="142" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="990" y="165" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">New Scan</text>
  <rect x="1050" y="142" width="110" height="36" rx="8" fill="#0F172A" />
  <text x="1105" y="165" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Export Report</text>

  <!-- ================= MAIN SCOREBOARD CARD ================= -->
  <g filter="url(#shadowLg)">
    <rect x="40" y="200" width="1120" height="230" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- Gauge Section (Left Col) -->
  <!-- Score Gauge Arc (r=56, circumference=351.85, 18% score -> offset=288.5) -->
  <circle cx="160" cy="295" r="56" stroke="#F1F5F9" stroke-width="12" fill="none" />
  <circle cx="160" cy="295" r="56" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" fill="none" 
          stroke-dasharray="351.85" stroke-dashoffset="288.5" transform="rotate(-90 160 295)" />
  <text x="160" y="298" font-size="34" font-weight="800" fill="#0F172A" text-anchor="middle">18%</text>
  <text x="160" y="318" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">NEUTRALITY INDEX</text>

  <!-- Severity Pill -->
  <rect x="65" y="370" width="190" height="26" rx="13" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
  <circle cx="80" cy="383" r="3.5" fill="#E11D48" />
  <text x="165" y="387" font-size="10.5" font-weight="700" fill="#9F1239" text-anchor="middle">High Bias (Action Required)</text>
  <text x="160" y="414" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Direction: <tspan font-weight="700" fill="#BE123C">Masculine-Skewed (+10)</tspan></text>

  <!-- Divider Line -->
  <line x1="285" y1="220" x2="285" y2="410" stroke="#E2E8F0" stroke-width="1" />

  <!-- Density & Breakdown Section (Right Col) -->
  <text x="315" y="235" font-size="16" font-weight="700" fill="#0F172A">Linguistic Density &amp; Word Balance Breakdown</text>
  <text x="315" y="253" font-size="12" font-weight="500" fill="#64748B">Evaluated across 128 total words. High concentration of coded terms suppresses application rates.</text>

  <!-- Masculine Density Bar -->
  <text x="315" y="285" font-size="12" font-weight="700" fill="#1D4ED8">♂ Masculine-Coded Terms</text>
  <text x="1120" y="285" font-size="12" font-weight="700" fill="#334155" text-anchor="end">10 words (7.8% density)</text>
  <rect x="315" y="293" width="805" height="10" rx="5" fill="#F1F5F9" />
  <rect x="315" y="293" width="620" height="10" rx="5" fill="#2563EB" />
  <text x="315" y="318" font-size="10.5" font-weight="500" fill="#64748B">Heavy saturation of combat metaphors, superhero tropes, and hyper-individualistic phrasing.</text>

  <!-- Feminine Density Bar -->
  <text x="315" y="345" font-size="12" font-weight="700" fill="#7E22CE">♀ Feminine-Coded Terms</text>
  <text x="1120" y="345" font-size="12" font-weight="700" fill="#334155" text-anchor="end">0 words (0.0% density)</text>
  <rect x="315" y="353" width="805" height="10" rx="5" fill="#F1F5F9" />
  <text x="315" y="378" font-size="10.5" font-weight="500" fill="#64748B">Zero communal words to counterbalance agentic phrasing.</text>

